# $schema: https://raw.githubusercontent.com/nknapp/cfgsync/refs/heads/main/docs/config-schema.json

# cfgsync configuration
#
# Each [[sync]] section defines one sync group with its
# own source directory, target directory, and glob patterns.

[[sync]]
source = "./etc-files"
target = "/etc"
# owner = "root:root"         # optional group default
# file_perms = "shared"        # optional: file permission preset (private|shared|group|group-read|public)
# dir_perms = "shared"         # optional: directory permission preset (private|shared|group|group-read|public)
# hooks = { after = "systemctl reload nginx" }   # optional: shell command run via /bin/sh after files are copied to target
globs = [
    "nginx/*.conf",
    { pattern = "ssh/sshd_config", file_perms = "private" },
    "**/*.service",
]

# [[sync.deviating]]
# path = "/etc/special-dir"
# owner = "root:root"
